              schema:
                $ref: '#/components/schemas/InvalidParameterException'
              examples:
                SetUserSettings481Example:
                  summary: Default SetUserSettings 481 response
                  x-microcks-default: true
                  value: example
        '482':
          description: NotAuthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedException'
              examples:
                SetUserSettings482Example:
                  summary: Default SetUserSettings 482 response
                  x-microcks-default: true
                  value: example
        '483':
          description: PasswordResetRequiredException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequiredException'
              examples:
                SetUserSettings483Example:
                  summary: Default SetUserSettings 483 response
                  x-microcks-default: true
                  value: example
        '484':
          description: UserNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundException'
              examples:
                SetUserSettings484Example:
                  summary: Default SetUserSettings 484 response
                  x-microcks-default: true
                  value: example
        '485':
