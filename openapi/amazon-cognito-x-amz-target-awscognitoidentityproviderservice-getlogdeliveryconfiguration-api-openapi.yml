components:
  schemas:
    LogLevel:
      type: string
      enum:
      - ERROR
    ResourceNotFoundException: {}
    LogDeliveryConfigurationType:
      type: object
      required:
      - UserPoolId
      - LogConfigurations
      properties:
        UserPoolId:
          allOf:
          - $ref: '#/components/schemas/UserPoolIdType'
          - description: The ID of the user pool where you configured detailed activity logging.
        LogConfigurations:
          allOf:
          - $ref: '#/components/schemas/LogConfigurationListType'
          - description: The detailed activity logging destination of a user pool.
      description: The logging parameters of a user pool.
    GetLogDeliveryConfigurationRequest:
      type: object
      required:
      - UserPoolId
      title: GetLogDeliveryConfigurationRequest
      properties:
        UserPoolId:
          allOf:
          - $ref: '#/components/schemas/UserPoolIdType'
          - description: The ID of the user pool where you want to view detailed activity logging configuration.
    UserPoolIdType:
      type: string
      pattern: '[\w-]+_[0-9a-zA-Z]+'
      minLength: 1
      maxLength: 55
    NotAuthorizedException: {}
    LogConfigurationType:
      type: object
      required:
      - LogLevel
      - EventSource
      properties:
        LogLevel:
          allOf:
          - $ref: '#/components/schemas/LogLevel'
          - description: The <code>errorlevel</code> selection of logs that a user pool sends for detailed activity logging.
        EventSource:
          allOf:
          - $ref: '#/components/schemas/EventSourceName'
          - description: The source of events that your user pool sends for detailed activity logging.
        CloudWatchLogsConfiguration:
          allOf:
          - $ref: '#/components/schemas/CloudWatchLogsConfigurationType'
          - description: The CloudWatch logging destination of a user pool.
      description: The logging parameters of a user pool.
    EventSourceName:
      type: string
      enum:
      - userNotification
    GetLogDeliveryConfigurationResponse:
      type: object
      properties:
        LogDeliveryConfiguration:
          allOf:
          - $ref: '#/components/schemas/LogDeliveryConfigurationType'
          - description: The detailed activity logging configuration of the requested user pool.
    ArnType:
      type: string
      pattern: arn:[\w+=/,.@-]+:[\w+=/,.@-]+:([\w+=/,.@-]*)?:[0-9]+:[\w+=/,.@-]+(:[\w+=/,.@-]+)?(:[\w+=/,.@-]+)?
      minLength: 20
      maxLength: 2048
    LogConfigurationListType:
      type: array
      items:
        $ref: '#/components/schemas/LogConfigurationType'
      minItems: 0
      maxItems: 1
    TooManyRequestsException: {}
    InvalidParameterException: {}
    InternalErrorException: {}
    CloudWatchLogsConfigurationType:
      type: object
      properties:
        LogGroupArn:
          allOf:
          - $ref: '#/components/schemas/ArnType'
          - description: The Amazon Resource Name (arn) of a CloudWatch Logs log group where your user pool sends logs. The log group must not be encrypted with Key Management Service and must be in the same Amazon Web Services account as your user pool.
      description: The CloudWatch logging destination of a user pool detailed activity logging configuration.
