          - description: The date and time, in <a href="https://www.iso.org/iso-8601-date-and-time-format.html">ISO 8601</a> format, when the item was created.
      description: A container for the UI customization information for a user pool's built-in app UI.
    GetUICustomizationResponse:
      type: object
      required:
      - UICustomization
      properties:
        UICustomization:
          allOf:
          - $ref: '#/components/schemas/UICustomizationType'
          - description: The UI customization information.
    GetUICustomizationRequest:
      type: object
      required:
      - UserPoolId
      title: GetUICustomizationRequest
      properties:
        UserPoolId:
          allOf:
          - $ref: '#/components/schemas/UserPoolIdType'
          - description: The user pool ID for the user pool.
        ClientId:
          allOf:
