                  summary: Default AdminSetUserPassword 480 response
                  x-microcks-default: true
                  value: example
        '481':
          description: NotAuthorizedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedException'
              examples:
                AdminSetUserPassword481Example:
                  summary: Default AdminSetUserPassword 481 response
                  x-microcks-default: true
                  value: example
        '482':
          description: UserNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundException'
              examples:
                AdminSetUserPassword482Example:
                  summary: Default AdminSetUserPassword 482 response
                  x-microcks-default: true
                  value: example
        '483':
          description: InternalErrorException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorException'
              examples:
                AdminSetUserPassword483Example:
                  summary: Default AdminSetUserPassword 483 response
                  x-microcks-default: true
                  value: example
        '484':
          description: TooManyRequestsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsException'
              examples:
                AdminSetUserPassword484Example:
                  summary: Default AdminSetUserPassword 484 response
                  x-microcks-default: true
                  value: example
        '485':
          description: InvalidParameterException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterException'
              examples:
                AdminSetUserPassword485Example:
                  summary: Default AdminSetUserPassword 485 response
                  x-microcks-default: true
                  value: example
        '486':
          description: InvalidPasswordException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidPasswordException'
              examples:
                AdminSetUserPassword486Example:
                  summary: Default AdminSetUserPassword 486 response
                  x-microcks-default: true
                  value: example
