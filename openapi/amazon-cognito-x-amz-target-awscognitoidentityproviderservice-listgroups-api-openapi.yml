components:
  parameters:
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  schemas:
    DateType:
      type: string
      format: date-time
    PrecedenceType:
      type: integer
      minimum: 0
    UserPoolIdType:
      type: string
      pattern: '[\w-]+_[0-9a-zA-Z]+'
      minLength: 1
      maxLength: 55
    GroupListType:
      type: array
      items:
        $ref: '#/components/schemas/GroupType'
    GroupNameType:
      type: string
      pattern: '[\p{L}\p{M}\p{S}\p{N}\p{P}]+'
      minLength: 1
      maxLength: 128
    ListGroupsResponse:
      type: object
      properties:
        Groups:
          allOf:
          - $ref: '#/components/schemas/GroupListType'
          - description: The group objects for the groups.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/PaginationKey'
          - description: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
    QueryLimitType:
      type: integer
      minimum: 0
      maximum: 60
    ResourceNotFoundException: {}
    NotAuthorizedException: {}
    ArnType:
      type: string
      pattern: arn:[\w+=/,.@-]+:[\w+=/,.@-]+:([\w+=/,.@-]*)?:[0-9]+:[\w+=/,.@-]+(:[\w+=/,.@-]+)?(:[\w+=/,.@-]+)?
      minLength: 20
      maxLength: 2048
    ListGroupsRequest:
      type: object
      required:
      - UserPoolId
      title: ListGroupsRequest
      properties:
        UserPoolId:
          allOf:
          - $ref: '#/components/schemas/UserPoolIdType'
          - description: The user pool ID for the user pool.
        Limit:
          allOf:
          - $ref: '#/components/schemas/QueryLimitType'
          - description: The limit of the request to list groups.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/PaginationKey'
          - description: An identifier that was returned from the previous call to this operation, which can be used to return the next set of items in the list.
    DescriptionType:
      type: string
      maxLength: 2048
    TooManyRequestsException: {}
    GroupType:
      type: object
      properties:
        GroupName:
          allOf:
          - $ref: '#/components/schemas/GroupNameType'
          - description: The name of the group.
        UserPoolId:
          allOf:
          - $ref: '#/components/schemas/UserPoolIdType'
          - description: The user pool ID for the user pool.
        Description:
          allOf:
          - $ref: '#/components/schemas/DescriptionType'
          - description: A string containing the description of the group.
        RoleArn:
          allOf:
          - $ref: '#/components/schemas/ArnType'
          - description: The role Amazon Resource Name (ARN) for the group.
        Precedence:
          allOf:
          - $ref: '#/components/schemas/PrecedenceType'
          - description: <p>A non-negative integer value that specifies the precedence of this group relative to the other groups that a user can belong to in the user pool. Zero is the highest precedence value. Groups with lower <code>Precedence</code> values take precedence over groups with higher ornull <code>Precedence</code> values. If a user belongs to two or more groups, it is the group with the lowest precedence value whose role ARN is given in the user's tokens for the <code>cognito:roles</code> and <code>cognito:preferred_role</code> claims.</p> <p>Two groups can have the same <code>Precedence</code> value. If this happens, neither group takes precedence over the other. If two groups with the same <code>Precedence</code> have the same role ARN, that role is used in the <code>cognito:preferred_role</code> claim in tokens for users in each group. If the two groups have different role ARNs, the <code>cognito:preferred_role</code> claim isn't set in users' tokens.</p> <p>The default <code>Precedence</code> value is null.</p>
        LastModifiedDate:
          allOf:
          - $ref: '#/components/schemas/DateType'
          - description: The date and time, in <a href="https://www.iso.org/iso-8601-date-and-time-format.html">ISO 8601</a> format, when the item was modified.
        CreationDate:
          allOf:
          - $ref: '#/components/schemas/DateType'
          - description: The date and time, in <a href="https://www.iso.org/iso-8601-date-and-time-format.html">ISO 8601</a> format, when the item was created.
      description: The group type.
    InternalErrorException: {}
    InvalidParameterException: {}
    PaginationKey:
      type: string
      pattern: '[\S]+'
      minLength: 1
